        </text>
        <text x="0" y="49" font-family="Verdana, 'Trebuchet MS', 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="bold" textLength="4650" lengthAdjust="spacing">
          <tspan fill="#C9A8F5">📊 FOCUS&#160;&#160;</tspan><tspan fill="#FFFFFF">Data Science · Machine Learning · AI</tspan><tspan fill="#9D7BC8">&#160;&#160;◆&#160;&#160;</tspan><tspan fill="#C9A8F5">🤖 BUILDING&#160;&#160;</tspan><tspan fill="#FFFFFF">practical ML apps &amp; data-driven tools</tspan><tspan fill="#9D7BC8">&#160;&#160;◆&#160;&#160;</tspan><tspan fill="#C9A8F5">📈 SKILLS&#160;&#160;</tspan><tspan fill="#FFFFFF">Data Analytics · NLP · Predictive Modeling</tspan><tspan fill="#9D7BC8">&#160;&#160;◆&#160;&#160;</tspan><tspan fill="#C9A8F5">🧠 EXPLORING&#160;&#160;</tspan><tspan fill="#FFFFFF">Generative AI · Deep Learning · MLOps · LLMs</tspan><tspan fill="#9D7BC8">&#160;&#160;◆&#160;&#160;</tspan><tspan fill="#C9A8F5">💻 HOBBY&#160;&#160;</tspan><tspan fill="#FFFFFF">programming &amp; side projects — just for fun</tspan><tspan fill="#9D7BC8">&#160;&#160;◆&#160;&#160;</tspan>
