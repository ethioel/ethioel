<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="36" viewBox="0 0 1250 36" role="img" aria-label="live status ticker">
  <defs>
    <clipPath id="cp"><rect width="1250" height="36" rx="18"/></clipPath>
  </defs>
  <rect width="1250" height="36" rx="18" fill="#161B22" stroke="#30363D"/>
  <g clip-path="url(#cp)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1250 0" dur="22s" repeatCount="indefinite"/>
      <g id="tick">
        <text x="0" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="15" textLength="1250" lengthAdjust="spacingAndGlyphs">
          <tspan fill="#9D7BC8" font-weight="700">🎯 focus&#160;&#160;</tspan><tspan fill="#E6E6E6">applied ML → production systems</tspan><tspan fill="#7D52AD">&#160;&#160;•&#160;&#160;</tspan><tspan fill="#9D7BC8" font-weight="700">🌱 learning&#160;&#160;</tspan><tspan fill="#E6E6E6">LLM fine-tuning &amp; systems design</tspan><tspan fill="#7D52AD">&#160;&#160;•&#160;&#160;</tspan><tspan fill="#9D7BC8" font-weight="700">💬 ask me&#160;&#160;</tspan><tspan fill="#E6E6E6">Python · PyTorch · TypeScript · AWS</tspan><tspan fill="#7D52AD">&#160;&#160;•&#160;&#160;</tspan><tspan fill="#9D7BC8" font-weight="700">⚡ open to&#160;&#160;</tspan><tspan fill="#E6E6E6">collaborations &amp; interesting problems</tspan><tspan fill="#7D52AD">&#160;&#160;•&#160;&#160;</tspan>
        </text>
      </g>
      <use href="#tick" x="1250"/>
    </g>
  </g>
</svg>
