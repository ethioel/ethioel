<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="76" viewBox="0 0 1250 76" role="img" aria-label="live status ticker">
  <defs>
    <clipPath id="cp"><rect width="1250" height="76" rx="38"/></clipPath>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="4650" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#0F0A1F"/>
      <stop offset="0.5" stop-color="#2A1B45"/>
      <stop offset="1" stop-color="#0F0A1F"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="4650 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1250" height="76" rx="38" fill="#161B22" stroke="#30363D"/>

  <g clip-path="url(#cp)">
    <rect width="1250" height="76" fill="url(#bg)"/>
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-4650 0" dur="42s" repeatCount="indefinite"/>
      <g id="tick">
